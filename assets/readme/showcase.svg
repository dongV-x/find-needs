<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">每次只走通一小段真实工作</title>
<desc id="desc">找需求把人员说法、当前页面和材料证据并排核对，再形成交接结果。</desc>
<rect width="1200" height="440" rx="28" fill="#F5F4F8"/>
<path d="M64 112H1136" stroke="#F0D9E7" stroke-width="2"/>
<text x="64" y="64" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" font-weight="800" letter-spacing="3" fill="#A85582">PROJECT PROOF / HOW IT WORKS</text>
<text x="64" y="98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="30" font-weight="800" fill="#1C1A27">每次只走通一小段真实工作</text>
<text x="64" y="144" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" fill="#686478">找需求把人员说法、当前页面和材料证据并排核对，再形成交接结果。</text>
<path d="M270 220C310 220 330 284 370 284" fill="none" stroke="#A85582" stroke-width="3" stroke-linecap="round"/>
<rect x="80" y="194" width="190" height="78" rx="18" fill="#F0D9E7" stroke="#A85582" stroke-width="2"/>
<text x="98" y="219" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="800" fill="#A85582">01</text>
<text x="98" y="250" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="21" font-weight="800" fill="#1C1A27">讲案例</text>
<text x="98" y="306" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" fill="#686478">最近一次真实发生了什么</text>
<path d="M560 284C600 284 620 220 660 220" fill="none" stroke="#A85582" stroke-width="3" stroke-linecap="round"/>
<rect x="370" y="258" width="190" height="78" rx="18" fill="#FFFFFF" stroke="#A85582" stroke-width="2"/>
<text x="388" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="800" fill="#A85582">02</text>
<text x="388" y="314" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="21" font-weight="800" fill="#1C1A27">看页面</text>
<text x="388" y="368" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" fill="#686478">实际操作，不凭标题猜</text>
<path d="M850 220C890 220 910 284 950 284" fill="none" stroke="#A85582" stroke-width="3" stroke-linecap="round"/>
<rect x="660" y="194" width="190" height="78" rx="18" fill="#F0D9E7" stroke="#A85582" stroke-width="2"/>
<text x="678" y="219" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="800" fill="#A85582">03</text>
<text x="678" y="250" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="21" font-weight="800" fill="#1C1A27">找差异</text>
<text x="678" y="306" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" fill="#686478">符合 · 不符 · 缺失</text>
<rect x="950" y="258" width="190" height="78" rx="18" fill="#FFFFFF" stroke="#A85582" stroke-width="2"/>
<text x="968" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="800" fill="#A85582">04</text>
<text x="968" y="314" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="21" font-weight="800" fill="#1C1A27">留证据</text>
<text x="968" y="368" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" fill="#686478">可继续补问和交接</text>
